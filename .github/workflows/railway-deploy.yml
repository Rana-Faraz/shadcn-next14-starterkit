name: Railway Deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Deploy to Production
        run: |
          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment production --team personal --service ${{ secrets.RAILWAY_SERVICE_NAME }}
          RAILWAY_TOKEN=${{ secrets.RAILWAY_PRODUCTION_TOKEN }} railway up

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Deploy Preview
        run: |
          # Create a unique environment name based on PR number
          PR_ENV="pr-${{ github.event.number }}"

          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment "$PR_ENV" --team personal --service ${{ secrets.RAILWAY_SERVICE_NAME }}
          RAILWAY_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway up

          # Get the deployment URL and post it as a comment
          DEPLOY_URL=$(RAILWAY_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway show --environment "$PR_ENV" --json | jq -r '.url')

          if [ ! -z "$DEPLOY_URL" ]; then
            echo "::set-output name=deploy_url::$DEPLOY_URL"
            
            # Post comment with deployment URL
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
              -d "{\"body\":\"🚀 Preview deployment is ready!\n\nURL: $DEPLOY_URL\"}"
          fi

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Remove Preview Environment
        run: |
          PR_ENV="pr-${{ github.event.number }}"
          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway environment delete "$PR_ENV" --yes
