name: Railway Deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Deploy to Production
        run: |
          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment production --team personal --service ${{ secrets.RAILWAY_SERVICE_NAME }}
          RAILWAY_TOKEN=${{ secrets.RAILWAY_PRODUCTION_TOKEN }} railway up

  deploy-preview:
    permissions: write-all
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Deploy Preview
        run: |
          # Create a unique service name for this PR
          PR_SERVICE="preview-pr-${{ github.event.number }}"

          # Link to the temp environment with the PR-specific service
          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment temp --team personal --service "$PR_SERVICE"

          # Check if service exists, create if it doesn't
          if ! RAILWAY_TOKEN=${{ secrets.RAILWAY_TEMP_TOKEN }} railway service "$PR_SERVICE" &>/dev/null; then
            echo "Creating new service: $PR_SERVICE"
            RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway add --service "$PR_SERVICE"
          else
            echo "Service $PR_SERVICE already exists, using existing service"
          fi

          # Deploy to the temp environment
          RAILWAY_TOKEN=${{ secrets.RAILWAY_TEMP_TOKEN }} railway up --service "$PR_SERVICE"

          # Wait a bit for the service to be ready
          sleep 10

          # Try to get the domain URL, handling both new and existing domains
          DOMAIN_OUTPUT=$(RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway domain --json --service "$PR_SERVICE" 2>&1)

          # First try to parse as JSON, if that fails, try to extract from the text output
          if echo "$DOMAIN_OUTPUT" | jq -e . >/dev/null 2>&1; then
            # JSON is valid, extract domain from it
            DEPLOY_URL=$(echo "$DOMAIN_OUTPUT" | jq -r '.domain')
          else
            # Not JSON, extract URL from text output
            DEPLOY_URL=$(echo "$DOMAIN_OUTPUT" | grep -o 'https://[^ ]*' | head -n1)
          fi

          if [ ! -z "$DEPLOY_URL" ] && [ "$DEPLOY_URL" != "null" ]; then
            echo "Preview URL: $DEPLOY_URL"
            echo "deploy_url=$DEPLOY_URL" >> $GITHUB_ENV
          else
            echo "Failed to get deployment URL"
            exit 1
          fi

      - name: Comment PR
        if: env.deploy_url != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 Preview deployment is ready!

            URL: ${{ env.deploy_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Remove Preview Service
        run: |
          PR_SERVICE="preview-pr-${{ github.event.number }}"
          RAILWAY_API_TOKEN=${{ secrets.RAILWAY_API_TOKEN }} railway down --service "$PR_SERVICE" --yes
